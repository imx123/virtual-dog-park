<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Golden Retriever</title>
  <rect width="200" height="200" rx="24" fill="#fdf8e7" />
  <ellipse cx="100" cy="180" rx="52" ry="9" fill="#4a3520" opacity="0.08" />

  <defs>
    <clipPath id="golden-body"><ellipse cx="100" cy="144" rx="44" ry="34" /></clipPath>
    <clipPath id="golden-head"><circle cx="100" cy="78" r="37" /></clipPath>
  </defs>

  <!-- feathery tail -->
  <path d="M139 138 C164 132 170 112 160 96" fill="none" stroke="#c98a2f" stroke-width="14" stroke-linecap="round" />
  <path d="M139 138 C164 132 170 112 160 96" fill="none" stroke="#e3aa52" stroke-width="9" stroke-linecap="round" />

  <!-- body and cream chest -->
  <ellipse cx="100" cy="144" rx="44" ry="34" fill="#e3aa52" stroke="#c98a2f" stroke-width="3" />
  <g clip-path="url(#golden-body)">
    <ellipse cx="100" cy="162" rx="30" ry="22" fill="#f7e9c6" />
  </g>

  <!-- front legs -->
  <rect x="73" y="148" width="18" height="36" rx="9" fill="#e3aa52" stroke="#c98a2f" stroke-width="3" />
  <rect x="109" y="148" width="18" height="36" rx="9" fill="#e3aa52" stroke="#c98a2f" stroke-width="3" />

  <!-- medium feathered ears -->
  <ellipse cx="60" cy="92" rx="14" ry="27" fill="#c98a2f" transform="rotate(18 60 92)" />
  <ellipse cx="140" cy="92" rx="14" ry="27" fill="#c98a2f" transform="rotate(-18 140 92)" />

  <!-- head with lighter forehead -->
  <circle cx="100" cy="78" r="37" fill="#e3aa52" stroke="#c98a2f" stroke-width="3" />
  <g clip-path="url(#golden-head)">
    <ellipse cx="100" cy="50" rx="30" ry="14" fill="#f0c684" opacity="0.65" />
  </g>

  <!-- broad muzzle and nose -->
  <ellipse cx="100" cy="94" rx="23" ry="15" fill="#f7e9c6" />
  <ellipse cx="100" cy="85" rx="9" ry="7" fill="#4a3520" />
  <path d="M100 92 v4" stroke="#4a3520" stroke-width="2.4" stroke-linecap="round" />
  <path d="M100 96 q-8 7 -14 1" fill="none" stroke="#4a3520" stroke-width="2.4" stroke-linecap="round" />
  <path d="M100 96 q8 7 14 1" fill="none" stroke="#4a3520" stroke-width="2.4" stroke-linecap="round" />
  <rect x="94" y="99" width="12" height="12" rx="6" fill="#e8707f" />

  <!-- eyes -->
  <circle cx="85" cy="72" r="5.2" fill="#4a3520" />
  <circle cx="115" cy="72" r="5.2" fill="#4a3520" />
  <circle cx="86.6" cy="70.3" r="1.7" fill="#ffffff" />
  <circle cx="116.6" cy="70.3" r="1.7" fill="#ffffff" />

  <!-- green bandana -->
  <path d="M70 110 q30 16 60 0" fill="none" stroke="#4a7c59" stroke-width="9" stroke-linecap="round" />
</svg>
