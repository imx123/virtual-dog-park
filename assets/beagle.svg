<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <title>Beagle</title>
  <rect width="200" height="200" rx="24" fill="#fbf1e4" />
  <ellipse cx="100" cy="180" rx="50" ry="9" fill="#3a2a1c" opacity="0.08" />

  <defs>
    <clipPath id="beagle-body"><ellipse cx="100" cy="144" rx="42" ry="34" /></clipPath>
    <clipPath id="beagle-head"><circle cx="100" cy="76" r="36" /></clipPath>
  </defs>

  <!-- tail, drawn behind the body -->
  <path d="M138 140 C160 136 166 118 158 104" fill="none" stroke="#6d4327" stroke-width="13" stroke-linecap="round" />
  <path d="M138 140 C160 136 166 118 158 104" fill="none" stroke="#fffdf8" stroke-width="8" stroke-linecap="round" />

  <!-- body and chest patch -->
  <ellipse cx="100" cy="144" rx="42" ry="34" fill="#fffdf8" stroke="#6d4327" stroke-width="3" />
  <g clip-path="url(#beagle-body)">
    <ellipse cx="100" cy="160" rx="28" ry="24" fill="#e5c49f" />
  </g>

  <!-- front legs -->
  <rect x="74" y="146" width="17" height="38" rx="8.5" fill="#fffdf8" stroke="#6d4327" stroke-width="3" />
  <rect x="109" y="146" width="17" height="38" rx="8.5" fill="#fffdf8" stroke="#6d4327" stroke-width="3" />

  <!-- long floppy ears, drawn behind the head -->
  <ellipse cx="64" cy="96" rx="15" ry="32" fill="#6d4327" transform="rotate(12 64 96)" />
  <ellipse cx="136" cy="96" rx="15" ry="32" fill="#6d4327" transform="rotate(-12 136 96)" />

  <!-- head and brown eye patch -->
  <circle cx="100" cy="76" r="36" fill="#fffdf8" stroke="#6d4327" stroke-width="3" />
  <g clip-path="url(#beagle-head)">
    <ellipse cx="118" cy="70" rx="20" ry="16" fill="#b07b4f" />
  </g>

  <!-- muzzle and nose -->
  <ellipse cx="100" cy="90" rx="21" ry="14" fill="#f4e3d0" />
  <ellipse cx="100" cy="82" rx="8.5" ry="6.5" fill="#2b2320" />
  <path d="M100 88.5 v4.5" stroke="#2b2320" stroke-width="2.4" stroke-linecap="round" />
  <path d="M100 93 q-7 6 -12 1" fill="none" stroke="#2b2320" stroke-width="2.4" stroke-linecap="round" />
  <path d="M100 93 q7 6 12 1" fill="none" stroke="#2b2320" stroke-width="2.4" stroke-linecap="round" />

  <!-- eyes -->
  <circle cx="86" cy="70" r="5" fill="#2b2320" />
  <circle cx="114" cy="70" r="5" fill="#2b2320" />
  <circle cx="87.6" cy="68.4" r="1.6" fill="#ffffff" />
  <circle cx="115.6" cy="68.4" r="1.6" fill="#ffffff" />

  <!-- collar and tag -->
  <path d="M70 112 q30 14 60 0" fill="none" stroke="#c0392b" stroke-width="9" stroke-linecap="round" />
  <circle cx="100" cy="122" r="5.5" fill="#f0c419" stroke="#c99b0d" stroke-width="1.5" />
</svg>
